<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English ↔ Español: I / I'm / You / You are</title>
<style>
:root{--bg:#f6f4ef;--fg:#1f2430;--card:#fff;--back:#1f6f5c;--backfg:#fff;--muted:#6b7280;--btn:#e7e3d9;--acc:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--fg:#eceef3;--card:#222733;--back:#2f8f77;--backfg:#fff;--muted:#9aa3b2;--btn:#2c3240;--acc:#fb923c}}
:root[data-theme="dark"]{--bg:#15181f;--fg:#eceef3;--card:#222733;--back:#2f8f77;--backfg:#fff;--muted:#9aa3b2;--btn:#2c3240;--acc:#fb923c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--muted);font-family:system-ui,sans-serif;font-size:.85rem;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.tabs button.on{background:var(--acc);color:#fff}
.bar{width:100%;max-width:560px;height:6px;background:var(--btn);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.count{font-family:system-ui,sans-serif;color:var(--muted);font-size:.85rem;margin-bottom:14px}
.scene{width:100%;max-width:560px;height:260px;perspective:1000px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:2rem;line-height:1.3;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.front{background:var(--card)}
.back{background:var(--back);color:var(--backfg);transform:rotateY(180deg)}
.tag{font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:12px}
.hint{font-family:system-ui,sans-serif;color:var(--muted);font-size:.8rem;margin:14px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-family:system-ui,sans-serif;background:var(--btn);color:var(--fg);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-size:.95rem}
button.p{background:var(--acc);color:#fff}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<h1>English ↔ Español</h1>
<div class="sub">Tap the card to flip · ← → keys to navigate</div>
<div class="tabs" id="tb"></div>
<div class="bar"><i id="pb"></i></div>
<div class="count" id="ct"></div>
<div class="scene" id="sc"><div class="card" id="cd">
<div class="face front"><div class="tag" id="t1">English</div><div id="fa"></div></div>
<div class="face back"><div class="tag" id="t2">Español</div><div id="fb"></div></div>
</div></div>
<div class="hint">Flip to check your answer</div>
<div class="row">
<button id="pv">← Prev</button>
<button class="p" id="fl">Flip</button>
<button id="nx">Next →</button>
<button id="sh">Shuffle</button>
<button id="sw">Swap sides</button>
</div>
<script>
var G={
"I":"I want|Yo quiero;I need|Yo necesito;I have|Yo tengo;I love|Yo amo;I know|Yo sé;I think|Yo pienso;I understand|Yo entiendo;I remember|Yo recuerdo;I forget|Yo olvido;I can|Yo puedo;I can't|Yo no puedo;I have to|Yo tengo que;I like|Me gusta",
"I'm":"I'm going to|Voy a;I'm coming|Estoy viniendo;I'm looking for|Estoy buscando;I'm trying|Estoy intentando;I'm learning|Estoy aprendiendo;I'm working|Estoy trabajando;I'm waiting|Estoy esperando;I'm eating|Estoy comiendo;I'm drinking|Estoy bebiendo;I'm watching|Estoy viendo;I'm listening|Estoy escuchando;I'm speaking|Estoy hablando;I'm studying|Estoy estudiando;I'm sleeping|Estoy durmiendo;I'm driving|Estoy conduciendo;I'm cooking|Estoy cocinando;I'm thinking|Estoy pensando;I'm feeling|Me estoy sintiendo;I'm staying|Me estoy quedando;I'm leaving|Me voy;I'm coming back|Estoy regresando;I'm going back|Estoy regresando;I'm getting ready|Me estoy preparando;I'm getting tired|Me estoy cansando;I'm getting hungry|Me está dando hambre;I'm getting better|Estoy mejorando;I'm having fun|Me estoy divirtiendo;I'm talking|Estoy hablando;I'm checking|Estoy revisando;I'm working on it|Estoy trabajando en ello",
"You":"You want|Tú quieres;You need|Tú necesitas;You have|Tú tienes;You love|Tú amas;You know|Tú sabes;You think|Tú piensas;You understand|Tú entiendes;You remember|Tú recuerdas;You forget|Tú olvidas;You can|Tú puedes;You can't|Tú no puedes;You have to|Tú tienes que;You like|Te gusta",
"You are":"You are going to|Vas a;You are coming|Estás viniendo;You are looking for|Estás buscando;You are trying|Estás intentando;You are learning|Estás aprendiendo;You are working|Estás trabajando;You are waiting|Estás esperando;You are eating|Estás comiendo;You are drinking|Estás bebiendo;You are watching|Estás viendo;You are listening|Estás escuchando;You are speaking|Estás hablando;You are studying|Estás estudiando;You are sleeping|Estás durmiendo;You are driving|Estás conduciendo;You are cooking|Estás cocinando;You are thinking|Estás pensando;You are feeling|Te estás sintiendo;You are staying|Te estás quedando;You are leaving|Te vas;You are coming back|Estás regresando;You are going back|Estás regresando;You are getting ready|Te estás preparando;You are getting tired|Te estás cansando;You are getting hungry|Te está dando hambre;You are getting better|Estás mejorando;You are having fun|Te estás divirtiendo;You are talking|Estás hablando;You are checking|Estás revisando;You are working on it|Estás trabajando en ello"};
var names=["All","I","I'm","You","You are"],all=[];
names.slice(1).forEach(function(n){G[n].split(";").forEach(function(s){var p=s.split("|");all.push({g:n,en:p[0],es:p[1]})})});
var cur="All",deck=all.slice(),i=0,swap=false;
var $=function(id){return document.getElementById(id)};
function build(){
  deck=all.filter(function(c){return cur==="All"||c.g===cur});i=0;
  $('tb').innerHTML="";
  names.forEach(function(n){
    var b=document.createElement('button');
    b.textContent=n+" ("+(n==="All"?all.length:G[n].split(";").length)+")";
    if(n===cur)b.className="on";
    b.onclick=function(){cur=n;build()};
    $('tb').appendChild(b);
  });
  show();
}
function show(){
  var c=deck[i];
  $('cd').classList.remove('flip');
  setTimeout(function(){
    $('fa').textContent=swap?c.es:c.en;
    $('fb').textContent=swap?c.en:c.es;
    $('t1').textContent=swap?'Español':'English';
    $('t2').textContent=swap?'English':'Español';
  },150);
  $('ct').textContent='Card '+(i+1)+' of '+deck.length;
  $('pb').style.width=((i+1)/deck.length*100)+'%';
}
function go(d){i=(i+d+deck.length)%deck.length;show()}
function flip(){$('cd').classList.toggle('flip')}
$('sc').onclick=flip;$('fl').onclick=flip;
$('nx').onclick=function(){go(1)};$('pv').onclick=function(){go(-1)};
$('sh').onclick=function(){
  for(var k=deck.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=deck[k];deck[k]=deck[j];deck[j]=t}
  i=0;show();
};
$('sw').onclick=function(){swap=!swap;show()};
document.onkeydown=function(e){
  if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();flip()}
};
build();
</script>
</body>
</html>
